name: Feature Request
description: Suggest an improvement or new feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion!

        Please keep requests focused and describe the use-case. "Why" matters as much as "what".

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Vincibility Raid Tools is this about?
      options:
        - Notes
        - Visual Notes
        - Reminders
        - Assignments
        - Groups / raid invites
        - Ready Check
        - Auras
        - Raid panel
        - Sync / Versions
        - Backup & Restore
        - Something new
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: What would you like to see added or improved?
      placeholder: e.g. Let the leader view show assignments for a chosen raid group only.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is this useful?
      description: The use-case, not just the idea.
      placeholder: e.g. Group leaders could follow just their own group's calls during the pull.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered (optional)
      placeholder: e.g. A filter dropdown on the leader view.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Extra notes / screenshots
    validations:
      required: false
